[project]
name = "bsbl"
version = "0.4.0"
description = "A newspaper-styled terminal UI for following MLB games, in the spirit of Newsboat."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
]

[project.scripts]
bsbl = "bsbl.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsbl"]
