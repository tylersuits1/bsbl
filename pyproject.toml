[project]
name = "sportspages-tui"
version = "0.1.0"
description = "A newspaper-styled terminal UI for following MLB, NCAAF, NFL, and NBA games, in the spirit of Newsboat."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
]

[project.scripts]
sportspages = "sportspages_tui.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sportspages_tui"]
